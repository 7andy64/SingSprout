name: sing_sprout
description: 声芽 SingSprout - AI音乐启蒙创作工具
version: 0.9.0+1
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  go_router: ^13.0.0
  http: ^1.1.2
  uuid: ^4.2.1
  flutter_animate: ^4.3.0
  crypto: ^3.0.3
  path_provider: ^2.1.1
  path: ^1.8.3
  sqflite: ^2.3.2
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.0.0
  just_audio: ^0.9.40
  share_plus: ^12.0.2
  archive: ^3.6.1
  record: ^5.2.1
  audioplayers: ^5.2.1
  permission_handler: ^11.3.1
  tflite_flutter: 0.11.0

dependency_overrides:
  record_linux: 1.3.1
flutter:
  assets:
    # Basic Pitch TFLite for on-device pitch detection (~0.84MB).
    # Downloaded from litert-community/Basic-Pitch-LiteRT (HuggingFace).
    # When missing, PitchDetectionService falls back to YIN gracefully.
    - assets/models/basicpitch.tflite

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  sqflite_common_ffi: ^2.3.3
  mocktail: ^1.0.4
  path_provider_platform_interface: any
