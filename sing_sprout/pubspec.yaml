name: sing_sprout
description: 声芽 SingSprout - AI音乐启蒙创作工具
version: 0.8.0+1
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  go_router: ^13.0.0
  http: ^1.1.2
  uuid: ^4.2.1
  flutter_animate: ^4.3.0
  crypto: ^3.0.3
  path_provider: ^2.1.1
  path: ^1.8.3
  sqflite: ^2.3.2
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.0.0
  just_audio: ^0.9.40
  share_plus: ^12.0.2
  archive: ^3.6.1
  record: ^7.1.1
  audioplayers: ^5.2.1
  permission_handler: ^11.3.1
  tflite_flutter: ^0.10.4

flutter:
  # TFLite model (assets/models/crepe_tiny.tflite) not included yet —
  # requires TensorFlow which doesn't support Python 3.14.
  # PitchDetectionService falls back to YIN algorithm gracefully.
  # assets:
  #   - assets/models/crepe_tiny.tflite

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  sqflite_common_ffi: ^2.3.3
  mocktail: ^1.0.4
